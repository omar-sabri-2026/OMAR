<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Omar Sabri Ahmad Khader | Golden Palm Real Estate</title>
  <meta name="description" content="Sales Consultant — Golden Palm Real Estate, Abu Dhabi" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      font-family: "Montserrat", sans-serif;
      background: #061812;
      color: #fff;
    }

    .page-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 100% 0%, rgba(200,161,74,0.08) 0%, transparent 50%),
        linear-gradient(165deg, #061812 0%, #0a1a14 100%);
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 390px;
      background: #0B1F18;
      border: 1.5px solid rgba(200, 161, 74, 0.45);
      border-radius: 28px;
      box-shadow:
        0 24px 64px rgba(0,0,0,0.5),
        inset 0 1px 0 rgba(200,161,74,0.15);
      overflow: hidden;
    }

    .card-inner {
      padding: 32px 24px 28px;
    }

    .logo {
      display: block;
      width: 100%;
      max-width: 320px;
      height: auto;
      max-height: 148px;
      object-fit: contain;
      margin: 0 auto 16px;
    }

    .divider {
      height: 1px;
      margin: 20px 0;
      background: rgba(200, 161, 74, 0.35);
    }

    /* Photo frame */
    .photo-wrap {
      position: relative;
      padding-right: 12px;
    }

    .photo-frame {
      position: relative;
      overflow: hidden;
      border-radius: 0 44px 0 0;
      border: 1px solid rgba(200, 161, 74, 0.45);
      border-bottom: none;
      border-left: none;
      box-shadow: 0 8px 32px rgba(0,0,0,0.35);
    }

    .photo-frame::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, #C8A14A 20%, #D4B05C 50%, #C8A14A 80%, transparent);
      z-index: 2;
    }

    .photo-frame::after {
      content: "";
      position: absolute;
      top: 0; right: 0;
      width: 1px;
      height: 100%;
      background: linear-gradient(180deg, #D4B05C, rgba(139,115,64,0.5));
      z-index: 2;
    }

    .photo {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 4.5;
      object-fit: cover;
      object-position: top center;
    }

    /* Identity */
    .identity {
      text-align: center;
      margin-top: 28px;
      padding: 0 8px;
    }

    .name {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.85rem;
      line-height: 1.1;
      margin-bottom: 16px;
    }

    .name-first { color: #C8A14A; font-weight: 700; }
    .name-last  { color: #fff; font-weight: 400; }

    .title {
      font-size: 10px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      font-weight: 400;
      color: rgba(255,255,255,0.88);
      margin-bottom: 8px;
    }

    .company {
      font-size: 9px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      font-weight: 300;
      color: rgba(200,161,74,0.85);
    }

    /* Contacts */
    .contacts {
      position: relative;
      margin-top: 8px;
    }

    .contacts::after {
      content: "";
      position: absolute;
      right: 5px;
      top: 12px;
      bottom: 12px;
      width: 1px;
      background: rgba(200,161,74,0.35);
    }

    .contact-row {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 10px 0;
      text-decoration: none;
      color: inherit;
      transition: opacity 0.2s;
    }

    .contact-row:hover { opacity: 0.85; }

    .icon-box {
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(200,161,74,0.55);
      border-radius: 6px;
      background: rgba(200,161,74,0.06);
    }

    .icon-box svg {
      width: 18px;
      height: 18px;
      stroke: #D4B05C;
      fill: none;
      stroke-width: 1.5;
    }

    .contact-text { flex: 1; min-width: 0; padding-top: 2px; }

    .contact-label {
      font-size: 9px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #8B7340;
      margin-bottom: 6px;
      font-weight: 500;
    }

    .contact-value {
      font-size: 14px;
      font-weight: 300;
      color: rgba(255,255,255,0.9);
      word-break: break-all;
    }

    .timeline-dot {
      flex-shrink: 0;
      width: 6px;
      height: 6px;
      margin-top: 10px;
      background: #C8A14A;
      transform: rotate(45deg);
      opacity: 0.85;
    }

    /* CTA */
    .save-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      margin-top: 28px;
      padding: 14px 24px;
      border: 1.5px solid rgba(200,161,74,0.65);
      border-radius: 999px;
      background: transparent;
      color: #C8A14A;
      font-family: inherit;
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: box-shadow 0.3s, transform 0.2s;
    }

    .save-btn:hover {
      box-shadow: 0 0 24px rgba(200,161,74,0.15);
      transform: scale(1.01);
    }

    .save-btn svg {
      width: 16px;
      height: 16px;
      stroke: #C8A14A;
      fill: none;
      stroke-width: 1.5;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 10px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(168,181,173,0.4);
    }
  </style>
</head>
